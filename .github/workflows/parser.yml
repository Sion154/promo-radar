name: Update coupons

on:
  schedule:
    # 06:00 UTC = 09:00 МСК, каждый день
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parser
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python parser/parser.py --source mock --post

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coupons.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update coupons [skip ci]"
            git push
          fi